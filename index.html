<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Cash Book</title>
<meta name="theme-color" content="#102a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cash Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#0f2236; --muted:#5f7186; --line:#e1e7ee; --line2:#c9d3de;
    --navy:#102a43; --navy2:#1c3d5e;
    --got:#0b7a55; --got-soft:#e3f4ec; --gave:#c0392b; --gave-soft:#fbe9e6;
    --shop:#3a4bc4; --shop-soft:#e8ebfb; --exc:#9a6200; --exc-soft:#fbf1dc;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid #5b8def;outline-offset:2px}

  /* Header */
  header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 16px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
  .top{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
  .top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
  .wa{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:19px;
    background:#25d366;color:#fff;font-size:15px;font-weight:600}
  .wa svg{width:18px;height:18px}
  .datebar{display:flex;align-items:center;gap:8px;margin:14px auto 0;max-width:640px}
  .datebar button.nav{width:44px;height:44px;border-radius:12px;border:0;flex:none;
    background:var(--navy2);color:#fff;display:grid;place-items:center}
  .datebar button.nav svg{width:20px;height:20px}
  .datebox{flex:1;position:relative;height:44px;border-radius:12px;background:#fff;color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px}
  .datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
  .today-chip{font-size:12px;font-weight:600;color:var(--got);background:var(--got-soft);
    border-radius:8px;padding:2px 7px;margin-left:8px}

  /* Cards */
  main{padding:16px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(16,42,67,.06),0 0 0 1px rgba(16,42,67,.05)}
  .card h2{margin:0;padding:14px 16px 10px;font-size:17px;font-weight:700;letter-spacing:-.2px;
    display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:10px;height:10px;border-radius:3px;background:currentColor;flex:none}
  .h-got{color:var(--got)} .h-gave{color:var(--gave)} .h-shop{color:var(--shop)}
  .card h2 span{color:var(--ink)}

  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 16px;border-top:1px solid var(--line)}
  .row.entry{cursor:pointer;transition:background .15s}
  .row.entry:active{background:#f4f7fa}
  .row .note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
  .row .note small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
  .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;letter-spacing:-.2px}
  .got{color:var(--got)} .gave{color:var(--gave)}
  /* Accounting double rule above totals */
  .total{font-weight:700;border-top:3px double var(--line2);background:#fafbfd;padding-top:13px;padding-bottom:13px}
  .total .amt{font-size:17px;font-weight:700}
  .empty{padding:12px 16px;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
  .sub{padding:12px 16px 6px;font-size:14px;font-weight:600;color:var(--muted);border-top:1px solid var(--line)}

  /* Balance */
  .balance{padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .balance .lbl{font-weight:700;font-size:17px}
  .balance .lbl small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
  .balance .amt{font-size:26px;font-weight:700}
  .card.hero{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(16,42,67,.22)}
  .card.hero .lbl small{color:#9fb3c8}
  .card.hero .amt.got{color:#5ee0a8} .card.hero .amt.gave{color:#ff8a7a}
  .card.hero .amt{font-size:30px}

  /* Shop */
  .shop-bal{border-top:1px solid var(--line);background:var(--shop-soft)}
  .shop-bal .lbl{color:var(--shop)}

  /* Exception */
  .ex-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;
    background:var(--card);color:var(--exc);padding:14px 16px;font-size:16px;font-weight:700}
  .ex-toggle .count{display:inline-block;min-width:24px;margin-left:8px;padding:2px 8px;border-radius:10px;
    background:var(--exc-soft);color:var(--exc);font-size:13px;text-align:center}
  .chev{font-size:14px;color:var(--muted)}

  /* Bottom actions */
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(238,242,246,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line)}
  .bottom button{flex:1;height:54px;border:0;border-radius:14px;color:#fff;font-size:17px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;max-width:310px}
  .bottom{justify-content:center}
  .bottom button svg{width:20px;height:20px}
  .b-got{background:var(--got);box-shadow:0 4px 12px rgba(11,122,85,.28)}
  .b-gave{background:var(--gave);box-shadow:0 4px 12px rgba(192,57,43,.25)}
  .bottom button:active{transform:scale(.98)}

  /* Sheets */
  .sheet-bg{position:fixed;inset:0;background:rgba(15,34,54,.45);z-index:10;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:22px 22px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility .25s;visibility:hidden;
    max-width:640px;margin:0 auto;overflow-x:hidden;max-height:92vh;overflow-y:auto}
  .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
  .open .sheet-bg{display:block}
  .open .sheet{transform:none;visibility:visible}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  .sheet h3{margin:0 0 14px;font-size:20px;letter-spacing:-.3px}
  label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{width:100%;height:50px;
    border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;font-size:17px;font-family:inherit;
    background:#fff;color:var(--ink)}
  .sheet input:focus{border-color:var(--navy2);outline:none}
  #fAmount{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;height:58px}
  .sheet input[type=date]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
  .seg{display:flex;background:#eef2f6;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;height:42px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,42,67,.12)}
  #typeSeg button[data-v=got].on{background:var(--got);color:#fff}
  #typeSeg button[data-v=gave].on{background:var(--gave);color:#fff}
  .checks{display:flex;gap:10px;margin-top:14px}
  .check{flex:1;display:flex;gap:10px;align-items:center;font-weight:600;padding:12px 14px;
    border:1.5px solid var(--line2);border-radius:12px}
  .check:has(input:checked){border-color:var(--navy2);background:#f2f6fb}
  .check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--navy)}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions button{flex:1;height:52px;border-radius:14px;border:0;font-size:17px;font-weight:700}
  .save{background:var(--navy);color:#fff}
  .cancel{background:#eef2f6;color:var(--ink)}
  .del{background:var(--gave-soft);color:var(--gave)}
  .tabs{display:flex;gap:4px;margin:14px auto 0;max-width:640px;background:var(--navy2);border-radius:12px;padding:4px}
  .tabs button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:#bcccdc;font-size:15px;font-weight:600}
  .tabs button.on{background:#fff;color:var(--ink)}
  .view[hidden],.datebar[hidden],.bottom[hidden]{display:none}
  .pbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .pbar .seg{flex:1}
  .pnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .pnav button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;
    box-shadow:0 0 0 1px rgba(16,42,67,.08)}
  .pnav button svg{width:20px;height:20px}
  .plabel{flex:1;height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;
    font-weight:600;box-shadow:0 0 0 1px rgba(16,42,67,.08)}
  .daygrp{padding:10px 16px 4px;font-size:14px;font-weight:600;color:var(--muted);border-top:1px solid var(--line)}
  .stats .row .amt{font-size:18px}
  .exp-actions{display:flex;gap:10px;margin-bottom:14px}
  .exp-actions button{flex:1;height:48px;border:0;border-radius:14px;font-size:16px;font-weight:700}
  .exp-actions .b-got{color:#fff}
  .exp-actions .cancel{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px rgba(16,42,67,.12)}
  .catrow{cursor:pointer}
  .catrow .chev{margin-left:8px}
  .catdetail{background:#f7f9fc}
  .catdetail .row{padding-left:28px}
  .catdetail .daygrp{padding-left:28px}
  .ttl{display:flex;align-items:center;gap:8px;min-width:0}
  .ttl h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{width:38px;height:38px;border:0;border-radius:12px;background:var(--navy2);color:#fff;display:grid;place-items:center;flex:none}
  .back[hidden],.tabs[hidden]{display:none}
  .back svg{width:20px;height:20px}
  .selectbox,#fCategory{width:100%;height:50px;border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;
    font-size:17px;font-family:inherit;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
  #xAmount{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;height:58px}
  .addcat{display:flex;gap:8px}
  .addcat input{flex:1;min-width:0}
  .addcat button{flex:none;height:50px;padding:0 18px;border:0;border-radius:12px;font-size:16px;font-weight:700}
  .catmanage{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .catmanage .row:first-child{border-top:0}
  .catmanage .row button{border:0;background:#eef2f6;color:var(--ink);font-size:14px;font-weight:600;height:34px;padding:0 12px;border-radius:9px;margin-left:6px}
  .catmanage .row button.rm{background:var(--gave-soft);color:var(--gave)}
  .tag.tag-exp{color:var(--gave);background:var(--gave-soft)}
  .catline{display:block;margin-top:4px}
  .catline .tag.tag-cat{margin-left:0}
  .tag.tag-cat{color:#7c3aed;background:#f1eafe}
  .xrow{cursor:pointer}
  .xrow:active{background:#f4f7fa}
  .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--shop);background:var(--shop-soft);
    border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="ttl"><button class="back" id="backBtn" hidden aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="appTitle">Cash Book</h1></div>
    <button class="wa" id="waBtn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3z"/></svg>WhatsApp</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="book" class="on">Cash Book</button><button data-v="exp">Expenses</button><button data-v="rep">Report</button>
  </nav>
  <div class="datebar">
    <button class="nav" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="datebox"><span id="dateLabel"></span><input type="date" id="datePick"></div>
    <button class="nav" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</header>

<main class="view" id="view-book">
  <section class="card" id="exCard">
    <button class="ex-toggle" id="exToggle">
      <span>Exception <span class="count" id="exCount">0</span></span>
      <span class="chev" id="exChev">▾</span>
    </button>
    <div id="exBody" hidden>
      <div id="exList"></div>
    </div>
  </section>

  <section class="card">
    <h2 class="h-got"><span>You Got</span></h2>
    <div id="gotList"></div>
    <div class="row total"><span>Total Got</span><span class="amt got" id="totalGot"></span></div>
  </section>

  <section class="card">
    <h2 class="h-gave"><span>You Gave</span></h2>
    <div id="gaveList"></div>
    <div class="row total"><span>Total Gave</span><span class="amt gave" id="totalGave"></span></div>
  </section>

  <section class="card hero">
    <div class="balance">
      <div class="lbl">Balance<small>Total Got − Total Gave</small></div>
      <div class="amt" id="balance"></div>
    </div>
  </section>

  <section class="card shop">
    <h2 class="h-shop"><span>Shop</span></h2>
    <div class="sub">Shop Got</div>
    <div id="shopGotList"></div>
    <div class="row total"><span>Total Got (Shop)</span><span class="amt got" id="shopTotalGot"></span></div>
    <div class="sub">Shop Gave</div>
    <div id="shopGaveList"></div>
    <div class="row total"><span>Total Gave (Shop)</span><span class="amt gave" id="shopTotalGave"></span></div>
    <div class="row"><span>Previous Day Shop Balance</span><span class="amt" id="prevShop"></span></div>
    <div class="balance shop-bal">
      <div class="lbl">Shop Balance<small>Got (Shop) − Gave (Shop) + Previous Balance</small></div>
      <div class="amt" id="shopBalance"></div>
    </div>
  </section>
</main>

<main class="view" id="view-exp" hidden>
  <div class="seg pseg" id="expSeg" style="margin-bottom:14px">
    <button data-v="week" class="on">Weekly</button><button data-v="month">Monthly</button>
  </div>
  <div class="pnav">
    <button id="expPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="plabel" id="expLabel"></div>
    <button id="expNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="exp-actions">
    <button class="b-got" id="addExpBtn">Add Expenses</button>
    <button class="cancel" id="addCatBtn">Add Categories</button>
  </div>
  <div id="expBody"></div>
</main>

<main class="view" id="view-rep" hidden>
  <div class="seg pseg" id="repSeg" style="margin-bottom:14px">
    <button data-v="week" class="on">Weekly</button><button data-v="month">Monthly</button>
  </div>
  <div class="pnav">
    <button id="repPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="plabel" id="repLabel"></div>
    <button id="repNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div id="repBody"></div>
</main>

<main class="view" id="view-cat" hidden>
  <div class="seg" id="catSeg" style="margin-bottom:14px">
    <button data-v="week" class="on">Weekly</button><button data-v="month">Monthly</button>
  </div>
  <div class="pnav">
    <button id="catPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="plabel" id="catLabel"></div>
    <button id="catNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div id="catBody"></div>
</main>

<div class="bottom" id="bottomBar">
  <button class="b-got" id="addGot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>You Got</button>
  <button class="b-gave" id="addGave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>You Gave</button>
</div>

<!-- Entry sheet -->
<div id="entryWrap">
  <div class="sheet-bg" data-close></div>
  <div class="sheet">
    <h3 id="entryTitle">New Entry</h3>
    <div class="seg" id="typeSeg">
      <button data-v="got">You Got</button><button data-v="gave">You Gave</button>
    </div>
    <label class="f">Amount (Rs)</label>
    <input type="number" inputmode="decimal" id="fAmount" placeholder="0">
    <label class="f">Detail</label>
    <input type="text" id="fNote" placeholder="Name or description">
    <label class="f">Entry for</label>
    <div class="seg" id="shopSeg">
      <button data-v="0">Daily</button><button data-v="1">Shop</button>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="fException"><span>Exception</span></label>
      <label class="check" id="excludeRow"><input type="checkbox" id="fExclude"><span>Exclude</span></label>
    </div>
    <div class="checks" id="expenseRow">
      <label class="check"><input type="checkbox" id="fExpense"><span>Expense</span></label>
    </div>
    <div id="catRow">
      <label class="f">Expense category</label>
      <select id="fCategory"></select>
    </div>
    <label class="f">Date</label>
    <input type="date" id="fDate">
    <div class="actions">
      <button class="del" id="delBtn">Delete</button>
      <button class="cancel" data-close>Cancel</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Expense entry sheet (Expenses only, not in Cash Book) -->
<div id="xWrap">
  <div class="sheet-bg" data-close></div>
  <div class="sheet">
    <h3 id="xTitle">Add Expense</h3>
    <label class="f">Amount (Rs)</label>
    <input type="number" inputmode="decimal" id="xAmount" placeholder="0">
    <label class="f">Detail</label>
    <input type="text" id="xNote" placeholder="Name or description">
    <label class="f">Category</label>
    <select id="xCategory" class="selectbox"></select>
    <label class="f">Date</label>
    <input type="date" id="xDate">
    <div class="actions">
      <button class="del" id="xDel">Delete</button>
      <button class="cancel" data-close>Cancel</button>
      <button class="save" id="xSave">Save</button>
    </div>
  </div>
</div>

<!-- Category sheet -->
<div id="catWrap">
  <div class="sheet-bg" data-close></div>
  <div class="sheet">
    <h3>Categories</h3>
    <label class="f">New category name</label>
    <div class="addcat"><input type="text" id="fNewCat" placeholder="e.g. Fuel"><button class="save" id="saveCatBtn">Add</button></div>
    <div class="catmanage" id="catList"></div>
    <div class="actions">
      <button class="cancel" data-close>Done</button>
    </div>
  </div>
</div>

<script>
/* ---------- Database (IndexedDB, stored on the phone) ---------- */
const DB_NAME = 'cashbook', STORE = 'entries';
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' }).createIndex('date', 'date');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode){ return db.transaction(STORE, mode).objectStore(STORE); }
function req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const putEntry = e => req(tx('readwrite').put(e));
const delEntry = id => req(tx('readwrite').delete(id));
const getRange = (from, to) => req(tx('readonly').index('date').getAll(IDBKeyRange.bound(from, to)));
const DEFAULT_CATS = ['Home Expenses', 'Chiller Expenses', 'ZAMEEN Expenses', 'Salary', 'Loan Repayment'];
let categories = DEFAULT_CATS.slice();
async function loadCategories(){
  const row = await req(db.transaction('meta').objectStore('meta').get('categories'));
  if (row && row.list && row.list.length) categories = row.list;
}
const saveCategories = () => req(db.transaction('meta', 'readwrite').objectStore('meta').put({ key: 'categories', list: categories }));
const getAll = () => req(tx('readonly').getAll());
const getBefore = d => req(tx('readonly').index('date').getAll(IDBKeyRange.upperBound(d, true)));

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); return toISO(new Date(y, m-1, d+n)); };
const fmt = n => 'Rs ' + Number(n).toLocaleString('en-PK', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const sum = arr => arr.reduce((a, e) => a + Number(e.amount), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function niceDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}
const byTime = (a, b) => a.createdAt - b.createdAt;

/* ---------- State & render ---------- */
let current = todayISO();

const tags = (e, withShop) =>
  (withShop && e.shop ? ' <span class="tag">Shop</span>' : '') +
  (e.expense ? ' <span class="tag tag-exp">Expense</span>' : '') +
  (e.exclude ? ' <span class="tag">Exclude</span>' : '') +
  (e.expense && e.category ? `<span class="catline"><span class="tag tag-cat">${esc(e.category)}</span></span>` : '');
function listHTML(items, cls, tagShop){
  if (!items.length) return '<div class="empty">No entries</div>';
  return items.map(e => `
    <div class="row entry" data-id="${e.id}">
      <div class="note">${esc(e.note || '—')}${tags(e, tagShop)}</div>
      <div class="amt ${cls}">${fmt(e.amount)}</div>
    </div>`).join('');
}
function setBal(el, v){
  el.textContent = fmt(v);
  el.className = 'amt ' + (v < 0 ? 'gave' : 'got');
}

const topCounts = e => !(e.shop && e.exclude);   // counts in Total Got / Total Gave / Balance
let dayEntries = [];
$('exToggle').onclick = () => {
  const b = $('exBody'); b.hidden = !b.hidden;
  $('exChev').textContent = b.hidden ? '▾' : '▴';
};
async function render(){
  $('dateLabel').innerHTML = esc(niceDate(current)) + (current === todayISO() ? '<span class="today-chip">Today</span>' : '');
  $('datePick').value = current;

  dayEntries = (await getRange(current, current)).filter(e => !e.expenseOnly).sort(byTime);
  const isGot = e => e.type === 'got', isGave = e => e.type === 'gave';

  // Exception: hidden from lists, still counted in totals
  const ex = dayEntries.filter(e => e.exception);
  $('exCount').textContent = ex.length;
  $('exList').innerHTML = ex.length ? ex.map(e => `
    <div class="row entry" data-id="${e.id}">
      <div class="note">${esc(e.note || '—')}${tags(e, true)}
        <small>${isGot(e) ? 'You Got' : 'You Gave'}</small></div>
      <div class="amt ${e.type}">${fmt(e.amount)}</div>
    </div>`).join('') : '<div class="empty">No exception entries</div>';

  // Top section: everything except Shop entries marked Exclude
  const top = dayEntries.filter(topCounts);
  const got = top.filter(isGot), gave = top.filter(isGave);
  $('gotList').innerHTML = listHTML(got.filter(e => !e.exception), 'got', true);
  $('gaveList').innerHTML = listHTML(gave.filter(e => !e.exception), 'gave', true);
  const tg = sum(got), tv = sum(gave);
  $('totalGot').textContent = fmt(tg);
  $('totalGave').textContent = fmt(tv);
  setBal($('balance'), tg - tv);

  // Shop section: all shop entries count; exceptions are not listed
  const shop = dayEntries.filter(e => e.shop);
  const sGot = shop.filter(isGot), sGave = shop.filter(isGave);
  $('shopGotList').innerHTML = listHTML(sGot.filter(e => !e.exception), 'got');
  $('shopGaveList').innerHTML = listHTML(sGave.filter(e => !e.exception), 'gave');
  const stg = sum(sGot), stv = sum(sGave);
  $('shopTotalGot').textContent = fmt(stg);
  $('shopTotalGave').textContent = fmt(stv);

  // Previous day shop balance = all shop Got − shop Gave before this date (carried forward)
  const prior = (await getBefore(current)).filter(e => e.shop && !e.expenseOnly);
  const prev = sum(prior.filter(e => e.type === 'got')) - sum(prior.filter(e => e.type === 'gave'));
  setBal($('prevShop'), prev);
  setBal($('shopBalance'), stg - stv + prev);

  // Text for the WhatsApp button (selected date, same as on screen)
  const lines = (arr, shopTag) => arr.length
    ? arr.map(e => `${e.note || '—'}${shopTag && e.shop ? ' (Shop)' : ''}: ${fmt(e.amount)}`)
    : ['No entries'];
  waText = [
    `*Cash Book — ${niceDate(current)}*`,
    '',
    '*You Got*', ...lines(got.filter(e => !e.exception), true), `*Total Got: ${fmt(tg)}*`,
    '',
    '*You Gave*', ...lines(gave.filter(e => !e.exception), true), `*Total Gave: ${fmt(tv)}*`,
    '',
    `*Balance: ${fmt(tg - tv)}*`,
    '',
    '*SHOP*',
    '_Shop Got_', ...lines(sGot.filter(e => !e.exception)), `Total Got (Shop): ${fmt(stg)}`,
    '',
    '_Shop Gave_', ...lines(sGave.filter(e => !e.exception)), `Total Gave (Shop): ${fmt(stv)}`,
    '',
    `Previous Day Shop Balance: ${fmt(prev)}`,
    `*Shop Balance: ${fmt(stg - stv + prev)}*`
  ].join('\n');
}
let waText = '';

/* ---------- Date navigation ---------- */
$('prevDay').onclick = () => { current = addDays(current, -1); render(); };
$('nextDay').onclick = () => { current = addDays(current, 1); render(); };
$('datePick').onchange = e => { if (e.target.value) { current = e.target.value; render(); } };

/* ---------- Sheets ---------- */
function openSheet(id){ $(id).classList.add('open'); }
function closeSheets(){ document.querySelectorAll('.open').forEach(x => x.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);

function setSeg(segId, val){
  document.querySelectorAll(`#${segId} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(val)));
}
function segVal(segId){ return document.querySelector(`#${segId} button.on`).dataset.v; }
['typeSeg', 'shopSeg'].forEach(s => document.querySelectorAll(`#${s} button`).forEach(b => b.onclick = () => { setSeg(s, b.dataset.v); syncExclude(); }));
// Exclude only applies to Shop entries
function syncExclude(){
  const isShop = segVal('shopSeg') === '1';
  $('excludeRow').style.display = isShop ? '' : 'none';
  if (!isShop) $('fExclude').checked = false;
  // Expense only applies to You Gave entries
  const isGave = segVal('typeSeg') === 'gave';
  $('expenseRow').style.display = isGave ? '' : 'none';
  if (!isGave) $('fExpense').checked = false;
  $('catRow').style.display = $('fExpense').checked ? '' : 'none';
}
function fillCategorySelect(selected){
  const opts = categories.slice();
  if (selected && !opts.includes(selected)) opts.push(selected);
  $('fCategory').innerHTML = '<option value="">Choose category</option>' +
    opts.map(c => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');
}
$('fExpense').onchange = syncExclude;

let editing = null;
function openEntry(type, entry){
  editing = entry || null;
  $('entryTitle').textContent = entry ? 'Edit Entry' : 'New Entry';
  setSeg('typeSeg', entry ? entry.type : type);
  setSeg('shopSeg', entry && entry.shop ? 1 : 0);
  $('fAmount').value = entry ? entry.amount : '';
  $('fNote').value = entry ? entry.note : '';
  $('fDate').value = entry ? entry.date : current;
  $('fException').checked = !!(entry && entry.exception);
  $('fExclude').checked = !!(entry && entry.exclude);
  $('fExpense').checked = !!(entry && entry.expense);
  fillCategorySelect(entry && entry.category);
  syncExclude();
  $('delBtn').style.display = entry ? '' : 'none';
  openSheet('entryWrap');
  if (!entry) setTimeout(() => $('fAmount').focus(), 250);
}
$('addGot').onclick = () => openEntry('got');
$('addGave').onclick = () => openEntry('gave');
document.querySelector('main').addEventListener('click', e => {
  const row = e.target.closest('.entry');
  if (row) openEntry(null, dayEntries.find(x => x.id === row.dataset.id));
});

$('saveBtn').onclick = async () => {
  const amount = parseFloat($('fAmount').value);
  if (!(amount > 0)) { alert('Please enter an amount.'); return; }
  const date = $('fDate').value || current;
  if (segVal('typeSeg') === 'gave' && $('fExpense').checked && !$('fCategory').value) { alert('Please choose an expense category.'); return; }
  const e = {
    id: editing ? editing.id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
    createdAt: editing ? editing.createdAt : Date.now(),
    date, amount, note: $('fNote').value.trim(),
    type: segVal('typeSeg'), shop: segVal('shopSeg') === '1',
    exception: $('fException').checked
  };
  e.exclude = e.shop && $('fExclude').checked;
  e.expense = e.type === 'gave' && $('fExpense').checked;
  e.category = e.expense ? $('fCategory').value : '';
  await putEntry(e);
  closeSheets();
  current = date;
  render(); renderPeriods();
};
$('delBtn').onclick = async () => {
  if (!editing || !confirm('Delete this entry?')) return;
  await delEntry(editing.id);
  closeSheets();
  render(); renderPeriods();
};

/* ---------- WhatsApp (selected date) ---------- */
// Opens the iPhone share menu so you can pick normal WhatsApp (not Business)
async function shareText(text){
  if (navigator.share) {
    try { await navigator.share({ text }); } catch (err) {}
    return;
  }
  try { await navigator.clipboard.writeText(text); alert('Copied. Paste it in WhatsApp.'); }
  catch (err) { prompt('Copy this text:', text); }
}
$('waBtn').onclick = () => shareText(catPage ? catText : tab === 'book' ? waText : tab === 'exp' ? expText : repText);

/* ---------- Tabs ---------- */
let tab = 'book';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.v; catPage = null; showCatPage(false);
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['book', 'exp', 'rep'].forEach(k => $('view-' + k).hidden = k !== tab);
  document.querySelector('.datebar').hidden = tab !== 'book';
  $('bottomBar').hidden = tab !== 'book';
  if (tab !== 'book') renderPeriods();
  window.scrollTo(0, 0);
});

/* ---------- Weekly / Monthly periods (week = Monday to Sunday) ---------- */
const parse = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
function periodOf(kind, offset){
  const t = parse(todayISO());
  if (kind === 'week') {
    const mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay() + 6) % 7) + offset * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    const f = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
    return { from: toISO(mon), to: toISO(sun), label: `${f(mon)} – ${f(sun)} ${sun.getFullYear()}`,
      title: offset === 0 ? 'This week' : offset === -1 ? 'Last week' : '' };
  }
  const first = new Date(t.getFullYear(), t.getMonth() + offset, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  return { from: toISO(first), to: toISO(last),
    label: first.toLocaleDateString('en-GB', { month:'long', year:'numeric' }),
    title: offset === 0 ? 'This month' : offset === -1 ? 'Last month' : '' };
}
const pstate = { exp: { kind: 'week', off: 0 }, rep: { kind: 'week', off: 0 } };
['exp', 'rep'].forEach(k => {
  document.querySelectorAll(`#${k}Seg button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${k}Seg button`).forEach(x => x.classList.toggle('on', x === b));
    pstate[k] = { kind: b.dataset.v, off: 0 }; renderPeriods();
  });
  $(k + 'Prev').onclick = () => { pstate[k].off--; renderPeriods(); };
  $(k + 'Next').onclick = () => { pstate[k].off++; renderPeriods(); };
});
const shortDate = iso => parse(iso).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
let expText = '', repText = '';
let catPage = null, catText = '', catItems = [];
const cstate = { kind: 'week', off: 0 };
function showCatPage(on){
  $('view-cat').hidden = !on;
  $('view-exp').hidden = on || tab !== 'exp';
  $('tabs').hidden = on;
  $('backBtn').hidden = !on;
  $('appTitle').textContent = on ? catPage : 'Cash Book';
  window.scrollTo(0, 0);
}
function setSegOn(segId, v){ document.querySelectorAll(`#${segId} button`).forEach(x => x.classList.toggle('on', x.dataset.v === v)); }
$('expBody').addEventListener('click', e => {
  const r = e.target.closest('.catrow'); if (!r) return;
  catPage = r.dataset.cat;
  Object.assign(cstate, pstate.exp); setSegOn('catSeg', cstate.kind);   // start on the same week/month
  showCatPage(true); renderPeriods();
});
$('backBtn').onclick = () => { catPage = null; showCatPage(false); renderPeriods(); };
document.querySelectorAll('#catSeg button').forEach(b => b.onclick = () => {
  setSegOn('catSeg', b.dataset.v); cstate.kind = b.dataset.v; cstate.off = 0; renderPeriods();
});
$('catPrev').onclick = () => { cstate.off--; renderPeriods(); };
$('catNext').onclick = () => { cstate.off++; renderPeriods(); };

// Edit any expense from the category page
$('catBody').addEventListener('click', e => {
  const r = e.target.closest('.xrow'); if (!r) return;
  const item = catItems.find(x => x.id === r.dataset.id); if (!item) return;
  item.expenseOnly ? openExpense(item) : openEntry(null, item);
});

/* Expense-only entry (does not appear in the Cash Book) */
let xEditing = null;
function fillSelect(el, selected){
  const opts = categories.slice();
  if (selected && !opts.includes(selected)) opts.push(selected);
  el.innerHTML = '<option value="">Choose category</option>' +
    opts.map(c => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');
}
function openExpense(entry){
  xEditing = entry || null;
  $('xTitle').textContent = entry ? 'Edit Expense' : 'Add Expense';
  $('xAmount').value = entry ? entry.amount : '';
  $('xNote').value = entry ? entry.note : '';
  fillSelect($('xCategory'), entry ? entry.category : (catPage && catPage !== 'No category' ? catPage : ''));
  $('xDate').value = entry ? entry.date : todayISO();
  $('xDel').style.display = entry ? '' : 'none';
  openSheet('xWrap');
  if (!entry) setTimeout(() => $('xAmount').focus(), 250);
}
$('addExpBtn').onclick = () => openExpense();
$('xSave').onclick = async () => {
  const amount = parseFloat($('xAmount').value), note = $('xNote').value.trim(), category = $('xCategory').value;
  if (!(amount > 0)) { alert('Please enter an amount.'); return; }
  if (!note) { alert('Please enter the detail.'); return; }
  if (!category) { alert('Please choose a category.'); return; }
  await putEntry({
    id: xEditing ? xEditing.id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)),
    createdAt: xEditing ? xEditing.createdAt : Date.now(),
    date: $('xDate').value || todayISO(), amount, note, category,
    type: 'gave', expense: true, expenseOnly: true
  });
  closeSheets(); renderPeriods();
};
$('xDel').onclick = async () => {
  if (!xEditing || !confirm('Delete this expense?')) return;
  await delEntry(xEditing.id); closeSheets(); renderPeriods();
};

/* Categories: add, rename, delete */
function renderCatList(){
  $('catList').innerHTML = categories.map((c, i) => `
    <div class="row"><div class="note">${esc(c)}</div>
      <div><button data-act="edit" data-i="${i}">Edit</button><button class="rm" data-act="del" data-i="${i}">Delete</button></div></div>`).join('')
    || '<div class="empty">No categories</div>';
}
async function moveCategory(from, to){
  const all = await getAll();
  for (const e of all) if (e.expense && e.category === from) { e.category = to; await putEntry(e); }
}
$('addCatBtn').onclick = () => { $('fNewCat').value = ''; renderCatList(); openSheet('catWrap'); };
const catExists = (name, skip) => categories.some((c, i) => i !== skip && c.toLowerCase() === name.toLowerCase());
$('saveCatBtn').onclick = async () => {
  const name = $('fNewCat').value.trim();
  if (!name) { alert('Please enter a category name.'); return; }
  if (catExists(name)) { alert('This category already exists.'); return; }
  categories.push(name); await saveCategories();
  $('fNewCat').value = ''; renderCatList(); renderPeriods();
};
$('catList').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = Number(b.dataset.i), old = categories[i];
  if (b.dataset.act === 'edit') {
    const name = (prompt('Rename category', old) || '').trim();
    if (!name || name === old) return;
    if (catExists(name, i)) { alert('This category already exists.'); return; }
    categories[i] = name; await saveCategories(); await moveCategory(old, name);
    if (catPage === old) { catPage = name; $('appTitle').textContent = name; }
  } else {
    if (!confirm(`Delete "${old}"? Its expenses will move to No category.`)) return;
    categories.splice(i, 1); await saveCategories(); await moveCategory(old, '');
  }
  renderCatList(); renderPeriods();
});

async function renderPeriods(){
  /* Expenses, category-wise */
  const ep = periodOf(pstate.exp.kind, pstate.exp.off);
  $('expLabel').textContent = ep.label;
  const ex = (await getRange(ep.from, ep.to)).filter(e => e.expense)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b));
  const et = sum(ex), heading = pstate.exp.kind === 'week' ? 'Weekly Expenses' : 'Monthly Expenses';
  const groups = categories.slice();
  ex.forEach(e => { const c = e.category || 'No category'; if (!groups.includes(c)) groups.push(c); });
  let html = '', txt = [`*${heading} — ${ep.label}*`, ''];
  groups.forEach(c => {
    const items = ex.filter(e => (e.category || 'No category') === c);
    html += `<div class="row catrow" data-cat="${esc(c)}"><div class="note">${esc(c)}</div>
      <div><span class="amt gave">${fmt(sum(items))}</span><span class="chev">›</span></div></div>`;
    txt.push(`${c}: ${fmt(sum(items))}`);
  });
  $('expBody').innerHTML = `<section class="card"><h2 class="h-gave"><span>${heading}</span></h2>${html}
    <div class="row total"><span>Total</span><span class="amt gave">${fmt(et)}</span></div></section>`;
  txt.push('', `*Total: ${fmt(et)}*`);
  expText = txt.join('\n');

  /* Category page */
  if (catPage) {
    const cp = periodOf(cstate.kind, cstate.off);
    $('catLabel').textContent = cp.label;
    catItems = (await getRange(cp.from, cp.to)).filter(e => e.expense && (e.category || 'No category') === catPage)
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byTime(a, b));
    const ch = `${catPage} — ${cstate.kind === 'week' ? 'Weekly' : 'Monthly'}`;
    let d = '', last = '', t = [`*${ch} — ${cp.label}*`, ''];
    catItems.forEach(e => {
      if (e.date !== last) { last = e.date; d += `<div class="daygrp">${esc(shortDate(e.date))}</div>`; t.push(`_${shortDate(e.date)}_`); }
      d += `<div class="row xrow" data-id="${e.id}"><div class="note">${esc(e.note || '—')}${e.shop ? ' <span class="tag">Shop</span>' : ''}</div><div class="amt gave">${fmt(e.amount)}</div></div>`;
      t.push(`${e.note || '—'}: ${fmt(e.amount)}`);
    });
    if (!catItems.length) { d = '<div class="empty">No expenses in this period</div>'; t.push('No expenses'); }
    $('catBody').innerHTML = `<div class="exp-actions"><button class="b-got" id="catAddBtn">Add Expenses</button></div>
      <section class="card"><h2 class="h-gave"><span>${esc(catPage)}</span></h2>${d}
      <div class="row total"><span>Total</span><span class="amt gave">${fmt(sum(catItems))}</span></div></section>`;
    $('catAddBtn').onclick = () => openExpense();
    t.push('', `*Total: ${fmt(sum(catItems))}*`);
    catText = t.join('\n');
  }

  /* Report: same totals as the top of the Cash Book */
  const rp = periodOf(pstate.rep.kind, pstate.rep.off);
  $('repLabel').textContent = rp.label;
  const top = (await getRange(rp.from, rp.to)).filter(e => topCounts(e) && !e.expenseOnly);
  const g = sum(top.filter(e => e.type === 'got')), v = sum(top.filter(e => e.type === 'gave'));
  const rh = pstate.rep.kind === 'week' ? 'Weekly Report' : 'Monthly Report';
  $('repBody').innerHTML = `<section class="card stats"><h2 class="h-got"><span>${rh}</span></h2>
      <div class="row"><span>Total Got</span><span class="amt got">${fmt(g)}</span></div>
      <div class="row"><span>Total Gave</span><span class="amt gave">${fmt(v)}</span></div></section>
    <section class="card hero"><div class="balance"><div class="lbl">Balance<small>Total Got − Total Gave</small></div>
      <div class="amt ${g - v < 0 ? 'gave' : 'got'}">${fmt(g - v)}</div></div></section>`;
  repText = [`*${rh} — ${rp.label}*`, '', `Total Got: ${fmt(g)}`, `Total Gave: ${fmt(v)}`, '', `*Balance: ${fmt(g - v)}*`].join('\n');
}

/* ---------- Start ---------- */
(async () => {
  db = await openDB();
  await loadCategories();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  render(); renderPeriods();
})();
/* ---------- Auto update ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update();
    // Check again whenever the app is brought back to the screen
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  });
  // When a new version takes over, reload once to show it
  let reloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    if (!document.querySelector('.open')) location.reload();   // never reload while a form is open
  });
}
</script>
</body>
